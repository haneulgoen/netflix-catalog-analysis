<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="refresh" content="0; url=slides/index.html" />
  <title>넷플릭스 데이터 분석 보고서 슬라이드덱 리다이렉트</title>
  <style>
    body {
      margin: 0;
      background: #141414;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(229, 9, 20, 0.2);
      border-top-color: #E50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #E50914;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
  <script>
    window.location.replace("slides/index.html");
  </script>
</head>
<body>
  <div class="spinner"></div>
  <p>슬라이드덱으로 이동 중입니다...</p>
  <p><small>자동으로 이동하지 않으면 <a href="slides/index.html">여기를 클릭하세요</a>.</small></p>
</body>
</html>
